version: 2.1
orbs:
  ruby: circleci/ruby@1.1.2
  node: circleci/node@5.2.0
  browser-tools: circleci/browser-tools@1.4.8

jobs:
  build:
    docker:
      - image: cimg/ruby:3.3.12
        environment:
          RAILS_ENV: development
          # Native gems (sassc especially) compile with one job per CPU the
          # container reports, which is the host's count on CircleCI. That
          # ran the container out of memory and killed bundle install.
          MAKEFLAGS: '-j2'
          BUNDLE_JOBS: '2'
    executor: ruby/default
    steps:
      - checkout
      - ruby/install-deps
  test:
    docker:
      - image: cimg/ruby:3.3.12
        environment:
          BUNDLE_JOBS: '2'
          BUNDLE_RETRY: '3'
          MAKEFLAGS: '-j2'
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          RAILS_ENV: test
          TEST_DB: circle_test
      # Match production's major version (Heroku Postgres 16).
      - image: cimg/postgres:16.10
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
      - image: docker.elastic.co/elasticsearch/elasticsearch:7.12.0
        environment:
          cluster.name: transbucket-test
          xpack.security.enabled: false
          transport.host: localhost
          network.host: 127.0.0.1
          http.port: 9200
          discovery.type: single-node
    executor: ruby/default
    steps:
      - checkout
      # The asset pipeline needs Node at runtime to compile the app's
      # .coffee files via ExecJS. browser-tools installs Chrome plus a
      # matching chromedriver explicitly rather than relying on the
      # deprecated cimg -browsers image variant.
      - node/install
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - ruby/install-deps
      # The Ruby image ships pg_dump 14, which refuses to dump a Postgres 16
      # server (db:migrate dumps db/structure.sql afterwards). Install the
      # client that matches the database image and production.
      - run:
          name: Install PostgreSQL 16 client
          command: |
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
            echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client-16
            pg_dump --version
      - run:
          name: Wait for db
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
      - run:
          name: Wait for elasticsearch
          command: dockerize -wait tcp://localhost:9200 -timeout 1m
      - run:
          name: Lift elasticsearch disk watermark restrictions
          command: |
            curl -XPUT -H "Content-Type: application/json" http://localhost:9200/_cluster/settings -d '{ "transient": { "cluster.routing.allocation.disk.threshold_enabled": false } }'
      - run: bundle exec rake db:create db:migrate
      # public/assets is gitignored and never precompiled here otherwise, so
      # JS-driven feature specs that load TinyMCE get a real 404 for its
      # skin CSS/fonts (served under /assets/tinymce/...) instead of the
      # content Capybara's headless Chrome expects -- a gap only a truly
      # fresh checkout hits, never a local machine with a leftover
      # public/assets from an earlier precompile or asset request.
      - run: bundle exec rake assets:precompile
      - run: bundle exec rspec || bundle exec rspec --only-failures || bundle exec rspec --only-failures

workflows:
  version: 2
  workflow:
    jobs:
    - build
    - test:
        requires:
          - build
