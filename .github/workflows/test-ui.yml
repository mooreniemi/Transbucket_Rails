name: UI Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react
    container:
      # Must match the exact `playwright` version in react/package.json, or the
      # bundled browsers won't be the ones Playwright expects. There is no
      # maintained `latest` tag. https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history for `onlyChanged` (TurboSnap)
          fetch-depth: 0

      # The container runs as root but the checkout is owned by the runner user,
      # so git refuses to read it (which breaks Chromatic) unless we trust it
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # ⚠️ Make sure to configure a `CHROMATIC_PROJECT_TOKEN` repository secret
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # `defaults.run.working-directory` only applies to `run:` steps, not actions
          workingDir: react
          onlyChanged: true
          skip: 'dependabot/**'
