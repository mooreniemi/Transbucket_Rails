en:
  about:
    title: About Transbucket
    meta_description: A community resource for procedure research and real-world outcomes.
    origin: was created in 2009 after Transster.com closed. The original founders later passed responsibility to Alex.
    welcome_heading: Who is welcome here?
    welcome: We welcome everyone who may benefit from real-life surgical experiences, including FTM, MTF, genderqueer, agender, detrans, desisted, post-trans, and cis people.
    community_note: Every photo and comment represents a real person. Be thoughtful and respect others.
    funding_heading: Why are there ads?
    funding: Ads help cover hosting costs so Transbucket can remain available.
    help_heading: How can I help?
    help: Volunteers can help with development, moderation, or sustainable funding. Please
    github_link: open an issue on GitHub
    contact: Contact Alex through the %{contact_link} or %{email_link}. You can also find us on %{facebook_link} and %{twitter_link}.
    contact_form: contact form
