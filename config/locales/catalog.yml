        a name like phallo or orchi gets you to the right results faster.
      discord_invite: The Discord community invite now points to a permanent link.
      locales: Transbucket now supports German, Spanish, French, Italian, Japanese,
        Simplified and Traditional Chinese, Portuguese, Dutch, Polish, Russian, Turkish,
        Vietnamese, and Arabic. Use the language links in the footer to switch.
