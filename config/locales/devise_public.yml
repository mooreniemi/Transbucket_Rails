en:
  devise:
    mailer:
      confirmation_instructions: { subject: "Confirmation instructions", greeting: "Hello %{recipient}", instruction: "You can confirm your account email through the link below:", action: "Confirm my account" }
      reset_password_instructions: { subject: "Reset password instructions", greeting: "Hello %{recipient}", instruction: "Someone has requested a link to change your password. You can do this through the link below:", action: "Change my password", instruction_2: "If you didn't request this, please ignore this email.", instruction_3: "Your password won't change until you access the link above and create a new one." }
      password_change: { subject: "Your password has changed", greeting: "Hello %{recipient}", message: "We're contacting you to notify you that your password has been changed." }
      unlock_instructions: { subject: "Unlock Instructions", greeting: "Hello %{recipient}", message: "Your account has been locked due to an excessive number of unsuccessful sign in attempts.", instruction: "Click the link below to unlock your account:", action: "Unlock my account" }
