    translation_notice: "Quan trọng: Trang pháp lý này hiện chỉ có bằng tiếng Anh. Chúng tôi không cung cấp văn bản pháp lý dịch bằng máy vì bản dịch tự động có thể có lỗi. Bản tiếng Anh là bản có giá trị chính thức."
ar:
  legal:
    translation_notice: "مهم: هذه الصفحة القانونية متاحة حالياً باللغة الإنجليزية فقط. لا نقدم نصاً قانونياً مترجماً آلياً لأن الترجمات الآلية قد تتضمن أخطاء. النسخة الإنجليزية هي النسخة المعتمدة."
