en:
  newsfeed:
    title: "Newsfeed"
    description: "Recent Transbucket release notes and user-facing updates."
    date: "September 2026"
    entries:
      procedure_cleanup: "We cleaned up a set of procedure names so common shorthand and typo variants now point to the same canonical procedure pages, which makes browsing and search results more consistent."
      prefix_search: "Procedure search now matches prefixes, so typing the start of a name like phallo or orchi gets you to the right results faster."
      discord_invite: "The Discord community invite now points to a permanent link."
      locales: "Transbucket now supports German, Spanish, French, Italian, Japanese, Simplified and Traditional Chinese, Portuguese, Dutch, Polish, Russian, Turkish, Vietnamese, and Arabic. Use the language links in the footer to switch."
de:
  newsfeed:
    title: "Neuigkeiten"
    description: "Aktuelle Transbucket-Versionshinweise und Änderungen für Nutzerinnen und Nutzer."
    date: "September 2026"
    entries:
      procedure_cleanup: "Wir haben mehrere Verfahrensnamen bereinigt, sodass gängige Abkürzungen und Tippfehler jetzt auf dieselben kanonischen Verfahrensseiten verweisen. Dadurch werden Browsing und Suchergebnisse konsistenter."
      prefix_search: "Die Verfahrenssuche findet jetzt Präfixe. Wenn du den Anfang eines Namens wie phallo oder orchi eingibst, werden passende Ergebnisse schneller gefunden."
      discord_invite: "Der Einladungslink zur Discord-Community ist jetzt dauerhaft gültig."
      locales: "Transbucket unterstützt jetzt Deutsch, Spanisch, Französisch, Italienisch, Japanisch, vereinfachtes und traditionelles Chinesisch, Portugiesisch, Niederländisch, Polnisch, Russisch, Türkisch, Vietnamesisch und Arabisch. Verwende die Sprachlinks im Footer zum Wechseln."
es:
  newsfeed:
    title: "Novedades"
    description: "Notas de versión recientes y actualizaciones para usuarios de Transbucket."
    date: "Septiembre de 2026"
    entries:
      procedure_cleanup: "Hemos corregido varios nombres de procedimientos para que las abreviaturas y los errores comunes dirijan a las mismas páginas canónicas. Esto hace más coherentes la navegación y los resultados de búsqueda."
      prefix_search: "La búsqueda de procedimientos ahora reconoce prefijos: escribir el inicio de un nombre como phallo u orchi lleva más rápido a los resultados adecuados."
      discord_invite: "El enlace de invitación a la comunidad de Discord ahora es permanente."
      locales: "Transbucket ahora admite alemán, español, francés, italiano, japonés, chino simplificado y tradicional, portugués, neerlandés, polaco, ruso, turco, vietnamita y árabe. Usa los enlaces de idioma del pie de página para cambiar."
fr:
  newsfeed:
    title: "Actualités"
    description: "Dernières notes de version et mises à jour utiles de Transbucket."
    date: "Septembre 2026"
    entries:
      procedure_cleanup: "Nous avons harmonisé plusieurs noms d’interventions afin que les abréviations courantes et les fautes de frappe renvoient aux mêmes pages canoniques. La navigation et les résultats de recherche sont ainsi plus cohérents."
      prefix_search: "La recherche d’interventions reconnaît maintenant les préfixes : saisir le début d’un nom comme phallo ou orchi permet de trouver plus vite les bons résultats."
      discord_invite: "Le lien d’invitation à la communauté Discord est maintenant permanent."
      locales: "Transbucket prend maintenant en charge l’allemand, l’espagnol, le français, l’italien, le japonais, le chinois simplifié et traditionnel, le portugais, le néerlandais, le polonais, le russe, le turc, le vietnamien et l’arabe. Utilisez les liens de langue dans le pied de page pour changer de langue."
it:
  newsfeed:
    title: "Novità"
    description: "Note di rilascio recenti e aggiornamenti utili di Transbucket."
    date: "Settembre 2026"
    entries:
      procedure_cleanup: "Abbiamo riordinato diversi nomi di procedure, così abbreviazioni comuni ed errori di battitura rimandano ora alle stesse pagine canoniche. Navigazione e risultati di ricerca sono più coerenti."
      prefix_search: "La ricerca delle procedure ora riconosce i prefissi: digitando l’inizio di un nome come phallo o orchi si trovano più rapidamente i risultati corretti."
      discord_invite: "Il link di invito alla comunità Discord è ora permanente."
      locales: "Transbucket supporta ora tedesco, spagnolo, francese, italiano, giapponese, cinese semplificato e tradizionale, portoghese, olandese, polacco, russo, turco, vietnamita e arabo. Usa i link della lingua nel piè di pagina per cambiare."
ja:
  newsfeed:
    title: "ニュース"
    description: "Transbucketの最近の更新情報とリリースノート。"
    date: "2026年9月"
    entries:
      procedure_cleanup: "複数の手術名を整理し、一般的な略称や入力ミスが同じ正式な手術ページを指すようにしました。閲覧と検索結果がより一貫します。"
      prefix_search: "手術検索が前方一致に対応しました。phalloやorchiのように名前の先頭を入力すると、該当する結果をより早く見つけられます。"
      discord_invite: "Discordコミュニティの招待リンクが恒久リンクになりました。"
      locales: "Transbucketはドイツ語、スペイン語、フランス語、イタリア語、日本語、簡体字・繁体字中国語、ポルトガル語、オランダ語、ポーランド語、ロシア語、トルコ語、ベトナム語、アラビア語に対応しました。フッターの言語リンクから切り替えられます。"
zh-CN:
  newsfeed:
    title: "新闻"
    description: "Transbucket近期的版本说明和用户更新。"
    date: "2026年9月"
    entries:
      procedure_cleanup: "我们整理了一批手术名称，使常见缩写和拼写错误现在都指向同一个规范手术页面，让浏览和搜索结果更加一致。"
      prefix_search: "手术搜索现在支持前缀匹配。输入 phallo 或 orchi 等名称开头即可更快找到相关结果。"
      discord_invite: "Discord 社区邀请链接现在是永久链接。"
      locales: "Transbucket 现在支持德语、西班牙语、法语、意大利语、日语、简体中文和繁体中文、葡萄牙语、荷兰语、波兰语、俄语、土耳其语、越南语和阿拉伯语。可使用页脚的语言链接切换。"
zh-TW:
  newsfeed:
    title: "最新消息"
    description: "Transbucket 最近的版本說明與使用者更新。"
    date: "2026年9月"
    entries:
      procedure_cleanup: "我們整理了一批手術名稱，讓常見縮寫與拼寫錯誤現在都會指向同一個規範手術頁面，讓瀏覽與搜尋結果更加一致。"
      prefix_search: "手術搜尋現在支援前綴比對。輸入 phallo 或 orchi 等名稱開頭即可更快找到相關結果。"
      discord_invite: "Discord 社群邀請連結現在是永久連結。"
      locales: "Transbucket 現在支援德語、西班牙語、法語、義大利語、日語、簡體中文與繁體中文、葡萄牙語、荷蘭語、波蘭語、俄語、土耳其語、越南語與阿拉伯語。可使用頁尾的語言連結切換。"
pt-BR:
  newsfeed:
    title: "Novidades"
    description: "Notas de versão recentes e atualizações úteis do Transbucket."
    date: "Setembro de 2026"
    entries:
      procedure_cleanup: "Organizamos vários nomes de procedimentos para que abreviações comuns e erros de digitação apontem para as mesmas páginas canônicas. A navegação e os resultados de busca ficaram mais consistentes."
      prefix_search: "A busca de procedimentos agora reconhece prefixos: digitar o começo de um nome, como phallo ou orchi, encontra os resultados corretos mais rapidamente."
      discord_invite: "O convite para a comunidade do Discord agora usa um link permanente."
      locales: "O Transbucket agora oferece alemão, espanhol, francês, italiano, japonês, chinês simplificado e tradicional, português, holandês, polonês, russo, turco, vietnamita e árabe. Use os links de idioma no rodapé para trocar."
nl:
  newsfeed:
    title: "Nieuws"
    description: "Recente Transbucket-release notes en updates voor gebruikers."
    date: "September 2026"
    entries:
      procedure_cleanup: "We hebben verschillende procedurenamen opgeschoond, zodat gebruikelijke afkortingen en typefouten naar dezelfde canonieke procedurepagina’s verwijzen. Zo zijn navigatie en zoekresultaten consistenter."
      prefix_search: "De procedurezoekfunctie herkent nu voorvoegsels. Typ het begin van een naam, zoals phallo of orchi, om sneller de juiste resultaten te vinden."
      discord_invite: "De uitnodigingslink voor de Discord-community is nu permanent."
      locales: "Transbucket ondersteunt nu Duits, Spaans, Frans, Italiaans, Japans, vereenvoudigd en traditioneel Chinees, Portugees, Nederlands, Pools, Russisch, Turks, Vietnamees en Arabisch. Gebruik de taallinks in de footer om te wisselen."
pl:
  newsfeed:
    title: "Aktualności"
    description: "Najnowsze informacje o wydaniach i aktualizacje Transbucket dla użytkowników."
    date: "Wrzesień 2026"
    entries:
      procedure_cleanup: "Uporządkowaliśmy nazwy kilku procedur, dzięki czemu popularne skróty i literówki prowadzą teraz do tych samych kanonicznych stron procedur. Przeglądanie i wyniki wyszukiwania są bardziej spójne."
      prefix_search: "Wyszukiwanie procedur obsługuje teraz prefiksy. Wpisanie początku nazwy, na przykład phallo lub orchi, szybciej pokaże właściwe wyniki."
      discord_invite: "Link zaproszenia do społeczności Discord jest teraz stały."
      locales: "Transbucket obsługuje teraz język niemiecki, hiszpański, francuski, włoski, japoński, chiński uproszczony i tradycyjny, portugalski, niderlandzki, polski, rosyjski, turecki, wietnamski i arabski. Użyj linków językowych w stopce, aby zmienić język."
ru:
  newsfeed:
    title: "Новости"
    description: "Последние примечания к выпускам и обновления Transbucket для пользователей."
    date: "Сентябрь 2026"
    entries:
      procedure_cleanup: "Мы привели в порядок названия нескольких процедур, поэтому распространённые сокращения и опечатки теперь ведут на одни и те же канонические страницы. Навигация и результаты поиска стали более согласованными."
      prefix_search: "Поиск процедур теперь поддерживает префиксы: если ввести начало названия, например phallo или orchi, нужные результаты находятся быстрее."
      discord_invite: "Ссылка-приглашение в сообщество Discord теперь постоянная."
      locales: "Transbucket теперь поддерживает немецкий, испанский, французский, итальянский, японский, упрощённый и традиционный китайский, португальский, нидерландский, польский, русский, турецкий, вьетнамский и арабский языки. Для смены языка используйте ссылки в нижнем колонтитуле."
tr:
  newsfeed:
    title: "Haberler"
    description: "Son Transbucket sürüm notları ve kullanıcı güncellemeleri."
    date: "Eylül 2026"
    entries:
      procedure_cleanup: "Bazı prosedür adlarını düzenledik; yaygın kısaltmalar ve yazım hataları artık aynı kanonik prosedür sayfalarına yönlendiriyor. Gezinme ve arama sonuçları daha tutarlı."
      prefix_search: "Prosedür araması artık ön ekleri tanıyor. phallo veya orchi gibi bir adın başlangıcını yazarak doğru sonuçlara daha hızlı ulaşabilirsiniz."
      discord_invite: "Discord topluluğu davet bağlantısı artık kalıcı."
      locales: "Transbucket artık Almanca, İspanyolca, Fransızca, İtalyanca, Japonca, Basitleştirilmiş ve Geleneksel Çince, Portekizce, Felemenkçe, Lehçe, Rusça, Türkçe, Vietnamca ve Arapçayı destekliyor. Değiştirmek için alt bilgideki dil bağlantılarını kullanın."
vi:
  newsfeed:
    title: "Tin tức"
    description: "Ghi chú phát hành và cập nhật gần đây dành cho người dùng Transbucket."
    date: "Tháng 9 năm 2026"
    entries:
      procedure_cleanup: "Chúng tôi đã sắp xếp lại tên một số thủ thuật để các tên viết tắt phổ biến và lỗi chính tả cùng trỏ đến một trang thủ thuật chuẩn. Việc duyệt trang và kết quả tìm kiếm nhất quán hơn."
      prefix_search: "Tìm kiếm thủ thuật giờ hỗ trợ tiền tố. Nhập phần đầu của tên như phallo hoặc orchi để tìm kết quả phù hợp nhanh hơn."
      discord_invite: "Liên kết mời cộng đồng Discord hiện là liên kết vĩnh viễn."
      locales: "Transbucket hiện hỗ trợ tiếng Đức, Tây Ban Nha, Pháp, Ý, Nhật, Trung giản thể và phồn thể, Bồ Đào Nha, Hà Lan, Ba Lan, Nga, Thổ Nhĩ Kỳ, Việt và Ả Rập. Dùng các liên kết ngôn ngữ ở chân trang để chuyển đổi."
ar:
  newsfeed:
    title: "الأخبار"
    description: "آخر ملاحظات إصدار Transbucket والتحديثات المفيدة للمستخدمين."
    date: "سبتمبر 2026"
    entries:
      procedure_cleanup: "نظفنا أسماء عدد من الإجراءات، فأصبحت الاختصارات الشائعة والأخطاء الإملائية تشير إلى صفحات الإجراءات نفسها. وهذا يجعل التصفح ونتائج البحث أكثر اتساقاً."
      prefix_search: "يدعم البحث عن الإجراءات الآن البحث بالبادئة. اكتب بداية اسم مثل phallo أو orchi للوصول إلى النتائج المناسبة بسرعة أكبر."
      discord_invite: "أصبح رابط دعوة مجتمع Discord دائماً."
      locales: "يدعم Transbucket الآن الألمانية والإسبانية والفرنسية والإيطالية واليابانية والصينية المبسطة والتقليدية والبرتغالية والهولندية والبولندية والروسية والتركية والفيتنامية والعربية. استخدم روابط اللغة في أسفل الصفحة للتبديل."
