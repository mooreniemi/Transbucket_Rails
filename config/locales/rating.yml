en:
  public:
    rating:
      sensation:
        help: Rate how much sensation you experience after this procedure, from none (1) to excellent (5).
        labels:
          1: None
          2: Very limited
          3: Some
          4: Good
          5: Excellent
        distribution: Sensation ratings
      satisfaction:
        help: Rate how satisfied you are with your outcome, from very dissatisfied (1) to very satisfied (5).
        labels:
          1: Very dissatisfied
          2: Dissatisfied
          3: Unsure
          4: Satisfied
          5: Very satisfied
        distribution: Satisfaction ratings
      view_submissions: View %{count} submissions rated %{score} out of 5
      overall_distribution: Overall rating distributions
