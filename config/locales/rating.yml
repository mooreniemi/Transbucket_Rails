        labels: { 1: 没有感觉, 2: 非常有限, 3: 一般, 4: 良好, 5: 极佳 }
      satisfaction:
        help: 请评价您对结果的满意度，从非常不满意（1）到非常满意（5）。
        labels: { 1: 非常不满意, 2: 不满意, 3: 不确定, 4: 满意, 5: 非常满意 }
zh-TW:
