en:
  public:
    rating:
      sensation:
        help: Rate how much sensation you experience after this procedure, from none (1) to excellent (5).
        labels:
          1: None
          2: Very limited
          3: Some
          4: Good
          5: Excellent
      satisfaction:
        help: Rate how satisfied you are with your outcome, from very dissatisfied (1) to very satisfied (5).
        labels:
          1: Very dissatisfied
          2: Dissatisfied
          3: Unsure
          4: Satisfied
          5: Very satisfied
de:
  public:
    rating:
      sensation:
        help: Bewerte, wie viel Empfindung du nach diesem Eingriff hast, von keiner (1) bis ausgezeichnet (5).
        labels: { 1: Keine, 2: Sehr eingeschränkt, 3: Etwas, 4: Gut, 5: Ausgezeichnet }
      satisfaction:
        help: Bewerte, wie zufrieden du mit deinem Ergebnis bist, von sehr unzufrieden (1) bis sehr zufrieden (5).
        labels: { 1: Sehr unzufrieden, 2: Unzufrieden, 3: Unsicher, 4: Zufrieden, 5: Sehr zufrieden }
es:
  public:
    rating:
      sensation:
        help: Indica cuánta sensibilidad tienes después de este procedimiento, desde ninguna (1) hasta excelente (5).
        labels: { 1: Ninguna, 2: Muy limitada, 3: Algo, 4: Buena, 5: Excelente }
      satisfaction:
        help: Indica tu satisfacción con el resultado, desde muy insatisfecho (1) hasta muy satisfecho (5).
        labels: { 1: Muy insatisfecho, 2: Insatisfecho, 3: No estoy seguro, 4: Satisfecho, 5: Muy satisfecho }
fr:
  public:
    rating:
      sensation:
        help: Évaluez la sensibilité ressentie après cette intervention, de aucune (1) à excellente (5).
        labels: { 1: Aucune, 2: Très limitée, 3: Moyenne, 4: Bonne, 5: Excellente }
      satisfaction:
        help: Évaluez votre satisfaction quant au résultat, de très insatisfait·e (1) à très satisfait·e (5).
        labels: { 1: Très insatisfait·e, 2: Insatisfait·e, 3: Incertain·e, 4: Satisfait·e, 5: Très satisfait·e }
it:
  public:
    rating:
      sensation:
        help: Valuta quanta sensibilità provi dopo questa procedura, da nessuna (1) a eccellente (5).
        labels: { 1: Nessuna, 2: Molto limitata, 3: Parziale, 4: Buona, 5: Eccellente }
      satisfaction:
        help: Valuta quanto sei soddisfattə del risultato, da per niente (1) a completamente (5).
        labels: { 1: Per niente, 2: Poco, 3: Incertə, 4: Soddisfattə, 5: Molto soddisfattə }
ja:
  public:
    rating:
      sensation:
        help: この手術後の感覚を、ない（1）から非常に良い（5）まで評価してください。
        labels: { 1: なし, 2: とても弱い, 3: 少しある, 4: 良い, 5: 非常に良い }
      satisfaction:
        help: 結果への満足度を、とても不満（1）からとても満足（5）まで評価してください。
        labels: { 1: とても不満, 2: 不満, 3: 迷っている, 4: 満足, 5: とても満足 }
zh-CN:
