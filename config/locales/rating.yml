      satisfaction:
        help: 請評估您對結果的滿意度，從非常不滿意（1）到非常滿意（5）。
        labels: { 1: 非常不滿意, 2: 不滿意, 3: 不確定, 4: 滿意, 5: 非常滿意 }
pt-BR:
  public:
    rating:
