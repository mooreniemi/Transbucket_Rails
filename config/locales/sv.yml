  devise:
    mailer:
      confirmation_instructions:
        subject: Bekräftelseinstruktioner
        greeting: Hej %{recipient}
        instruction: "Du kan bekräfta din e-postadress genom länken nedan:"
        action: Bekräfta mitt konto
        reminder_notice: Detta är en påminnelse. Vi ser att du ännu inte har bekräftat ditt konto.
        reminder_help: Behöver du hjälp med att bekräfta kontot? Svara på det här e-postmeddelandet.
      reset_password_instructions:
        subject: Instruktioner för återställning av lösenord
        greeting: Hej %{recipient}
        instruction: "Någon har begärt en länk för att ändra ditt lösenord. Du kan göra det via länken nedan:"
        action: Ändra mitt lösenord
        instruction_2: Om du inte begärde detta kan du ignorera meddelandet.
        instruction_3: Ditt lösenord ändras inte förrän du öppnar länken ovan och skapar ett nytt.
      unlock_instructions:
        subject: Instruktioner för upplåsning
        greeting: Hej %{recipient}
        message: Ditt konto har låsts efter för många misslyckade inloggningsförsök.
        instruction: "Klicka på länken nedan för att låsa upp ditt konto:"
        action: Lås upp mitt konto
      password_change:
        subject: Ditt lösenord har ändrats
        greeting: Hej %{recipient}
        message: Vi kontaktar dig för att meddela att ditt lösenord har ändrats.
  comment_mailer:
    subject: "Transbucket.com: Ny %{comment_type} på %{id}"
    types:
      comment: kommentar
      question: fråga
    greeting: Hej %{username}!
    posted: En annan medlem har publicerat en %{comment_type} på ditt bidrag.
    reply: Klicka på %{link} om du vill svara.
    this_link: den här länken
    flag_help: Om du har synpunkter på kommentaren kan du flagga den. Tre flaggor från olika användare skickar den automatiskt till granskning.
    unsubscribe: Sluta få dessa aviseringar genom att ändra dina aviseringsinställningar på %{link}.
